const hudC = document.createElement('canvas'); hudC.id = 'hud'; hudC.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2'; if(LOOK === 'app'){ $('#stage').appendChild(hudC); document.querySelectorAll('.top,.bottom,.place,.credit').forEach(e => e.style.display = 'none'); }

function frame(u, first){

const uOfKm = km => { let lo = 0, hi = 1; for(let k=0;k<40;k++){ const m = (lo+hi)/2; distAtTime(m) < km*1000 ? lo = m : hi = m; } return (lo+hi)/2; };
window.__nav = {frame, uOfKm, map, TOTAL, ready: () => carLayer.ready && map.loaded() && map.areTilesLoaded(), trip, dbg: () => ({ready: carLayer.ready, car: carState, model: !!carModel, wheels: wheels.length, err: window.__carErr || null})};
frame(0, true);
/* reprodução: o tempo só avança com o mapa carregado (sem saltos); na gravação o gravador pausa enquanto carrega */
let playing = false;
function run(rec){
  if(playing) return; playing = true; let u = 0, last = null; camBear = null;
  let waitSince = null;
  const tick = t => {
    const dt = last === null ? 0 : Math.min(.1, (t - last)/1000); last = t;
    let loaded = map.isSourceLoaded('omt') && carLayer.ready;   // espera só pelas ruas e prédios; o relevo pode chegar depois
    if(!loaded){ waitSince = waitSince ?? t; if(t - waitSince > 4000) loaded = true; } else waitSince = null;
    if(rec){ if(!loaded && rec.state === 'recording') rec.pause(); if(loaded && rec.state === 'paused') rec.resume(); }
    if(loaded) u = Math.min(1, u + dt/DUR);
    frame(u, u === 0); if(rec){ drawRec(); status(`A gravar… ${Math.round(u*100)}%`); }

  };
