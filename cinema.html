import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const $ = s => document.querySelector(s);
const status = t => $('#status').textContent = t;
const TURN = new URLSearchParams(location.search).get('turn') === '1';   // apresentação 360° do carro
const TEX = 2048;              // map texture size (px) = world units of the map plane
const isPhone = innerWidth < 900;
let W = isPhone ? 1280 : 1920, H = W * 9/16;

/* ---------- trip data: from the app (localStorage) or a demo route ---------- */
function loadTrip(){ try{ const t = JSON.parse(localStorage.getItem('lr.current')); if(t && t.route && t.route.length > 10) return t; }catch(e){} return null; }
async function demoTrip(){
  const o = {lat:41.6932, lon:-8.8329, name:'Viana do Castelo'}, d = {lat:41.7675, lon:-8.5839, name:'Ponte de Lima'};
  const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${d.lon},${d.lat}?overview=full&geometries=geojson`).then(r => r.json());
  return { origin:o, dest:d, route: r.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), distance: r.routes[0].distance, duration: r.routes[0].duration, stops: [{name:'Lanheses', lat:41.7357, lon:-8.7218},{name:'Ponte Medieval', lat:41.7686, lon:-8.5852}], track: [], tollM: 0 };
}
const settings = Object.assign({fuel:'Gasóleo', cons:6.5, price:1.72}, (()=>{ try{ return JSON.parse(localStorage.getItem('lr.settings')) || {}; }catch(e){ return {}; } })());
const eur = n => '€' + (Math.round(n*100)/100).toFixed(2).replace('.', ',');
const km = m => (m/1000 < 10 ? (m/1000).toFixed(1) : Math.round(m/1000)).toString().replace('.', ',') + ' km';
const mins = s => { const m = Math.round(s/60); return m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + String(m%60).padStart(2,'0'); };

/* ---------- map texture from real OSM tiles, paper look ---------- */
const lon2x = (lon, z) => (lon + 180) / 360 * 2**z * 256;
const lat2y = (lat, z) => { const r = lat*Math.PI/180; return (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI) / 2 * 2**z * 256; };
function loadImg(src){ return new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
async function buildMap(route){
  const lats = route.map(p=>p[0]), lons = route.map(p=>p[1]);
  const b = {minLat:Math.min(...lats), maxLat:Math.max(...lats), minLon:Math.min(...lons), maxLon:Math.max(...lons)};
  let z = 17; while(z > 3){ const w = lon2x(b.maxLon,z)-lon2x(b.minLon,z), h = lat2y(b.minLat,z)-lat2y(b.maxLat,z); if(Math.max(w,h) < TEX*0.55) break; z--; }
  const cx = (lon2x(b.minLon,z)+lon2x(b.maxLon,z))/2, cy = (lat2y(b.minLat,z)+lat2y(b.maxLat,z))/2;
  const ox = cx - TEX/2, oy = cy - TEX/2;
  const c = document.createElement('canvas'); c.width = c.height = TEX; const ctx = c.getContext('2d');
  ctx.fillStyle = '#E8E0D0'; ctx.fillRect(0,0,TEX,TEX);
  const jobs = [];
  for(let x = Math.floor(ox/256); x <= Math.floor((ox+TEX)/256); x++) for(let y = Math.floor(oy/256); y <= Math.floor((oy+TEX)/256); y++) jobs.push(loadImg(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`).then(im => { if(im){ ctx.filter = 'saturate(1.9) contrast(1.3) brightness(.93)'; ctx.drawImage(im, x*256-ox, y*256-oy, 256, 256); ctx.filter = 'none'; } }));
  status('A carregar o mapa real…'); await Promise.all(jobs);
  // paper look: warm multiply, grain, vignette
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#CFBD9A'; ctx.fillRect(0,0,TEX,TEX);
  ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = 'rgba(255,214,160,.18)'; ctx.fillRect(0,0,TEX,TEX);
  ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createRadialGradient(TEX/2,TEX/2,TEX*.3,TEX/2,TEX/2,TEX*.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(30,20,10,.55)'); ctx.fillStyle = g; ctx.fillRect(0,0,TEX,TEX);
  const noise = document.createElement('canvas'); noise.width = noise.height = 256; const nd = noise.getContext('2d'); const id = nd.createImageData(256,256); for(let i=0;i<id.data.length;i+=4){ const v = 110 + Math.random()*40; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; } nd.putImageData(id,0,0);
  ctx.globalAlpha = .12; ctx.globalCompositeOperation = 'overlay'; for(let x=0;x<TEX;x+=256) for(let y=0;y<TEX;y+=256) ctx.drawImage(noise,x,y); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const toWorld = p => new THREE.Vector3(lon2x(p[1],z)-ox-TEX/2, 0, lat2y(p[0],z)-oy-TEX/2);
  return { canvas: c, noise, toWorld, z, ox, oy };
}
function paperTile(im){ const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.filter = 'saturate(1.9) contrast(1.3) brightness(.93)'; x.drawImage(im,0,0); x.filter = 'none'; x.globalCompositeOperation = 'multiply'; x.fillStyle = '#CFBD9A'; x.fillRect(0,0,256,256); x.globalCompositeOperation = 'overlay'; x.fillStyle = 'rgba(255,214,160,.24)'; x.fillRect(0,0,256,256); return c; }
async function buildDetail(routePts, m, bump){
  const zd = m.z + 2, F = 4, S = 256/F; const want = new Map();
  for(let i=0;i<routePts.length;i+=3){ const p = routePts[i]; const tx = Math.floor((p.x + m.ox + TEX/2)*F/256), ty = Math.floor((p.z + m.oy + TEX/2)*F/256); for(let dx=-5;dx<=5;dx++) for(let dy=-5;dy<=5;dy++){ if(dx*dx+dy*dy > 30) continue; want.set(`${tx+dx},${ty+dy}`, [tx+dx, ty+dy]); } }
  status(`A carregar detalhe das ruas (${want.size} peças)…`);
  const group = new THREE.Group(); let n = 0;
  await Promise.all([...want.values()].map(async ([tx,ty]) => { const im = await loadImg(`https://tile.openstreetmap.org/${zd}/${tx}/${ty}.png`); if(!im) return; const tex = new THREE.CanvasTexture(paperTile(im)); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8; const mesh = new THREE.Mesh(new THREE.PlaneGeometry(S, S), new THREE.MeshStandardMaterial({map: tex, roughness: .95, metalness: 0, bumpMap: bump, bumpScale: .35, envMapIntensity: .25})); mesh.rotation.x = -Math.PI/2; mesh.position.set(tx*S + S/2 - m.ox - TEX/2, 0.35, ty*S + S/2 - m.oy - TEX/2); mesh.receiveShadow = true; group.add(mesh); n++; }));
  scene.add(group); return n;
}

/* ---------- scene ---------- */
const gl = $('#gl'), out = $('#out'); const octx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({canvas: gl, antialias: true, powerPreference: 'high-performance'});
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.88;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#071420'); scene.fog = new THREE.Fog('#0B2233', TEX*0.7, TEX*2.0);
const camera = new THREE.PerspectiveCamera(38, 16/9, 2, TEX*4);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight('#FFD9A8', 1.35); sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0002; sun.shadow.normalBias = 1.5; scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight('#3F86C4', '#2A1E14', 0.4));
const rim = new THREE.DirectionalLight('#2F8FD6', 1.0); rim.position.set(-TEX, TEX*.6, -TEX*.4); scene.add(rim);
let composer, bokeh, bloom;
function setSize(w, h){ W = w; H = h; out.width = w; out.height = h; renderer.setSize(w, h, false); renderer.setPixelRatio(1); camera.aspect = w/h; camera.updateProjectionMatrix(); composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera)); bloom = new UnrealBloomPass(new THREE.Vector2(w,h), 0.33, 0.5, 1.55); composer.addPass(bloom); bokeh = new BokehPass(scene, camera, {focus: 400, aperture: 0.00003, maxblur: 0.009}); composer.addPass(bokeh); composer.addPass(new OutputPass()); }

/* car: procedural coupé with clearcoat paint (swap for a .glb of the real car later) */
function buildCar(L){
  const g = new THREE.Group(); const s = L/4.6;
  const paint = new THREE.MeshPhysicalMaterial({color:'#07080B', metalness:.45, roughness:.28, clearcoat:1, clearcoatRoughness:.07, envMapIntensity:1.1});
  const trim = new THREE.MeshStandardMaterial({color:'#0C0D10', metalness:.6, roughness:.5});
  const glass = new THREE.MeshPhysicalMaterial({color:'#0B1119', metalness:.3, roughness:.08, envMapIntensity:1.0, transparent:true, opacity:.97});
  // body: coupé side profile with wheel arches, extruded across the width with soft bevels
  const prof = new THREE.Shape();
  prof.moveTo(-2.25,.46); prof.lineTo(-2.32,.66); prof.lineTo(-2.28,.96); prof.quadraticCurveTo(-2.0,1.03,-1.5,1.04); prof.quadraticCurveTo(-1.0,1.07,-.55,1.40); prof.lineTo(.5,1.42); prof.quadraticCurveTo(1.0,1.28,1.42,1.0); prof.quadraticCurveTo(1.95,.95,2.3,.8); prof.lineTo(2.34,.5); prof.lineTo(2.3,.46);
  prof.lineTo(1.96,.46); prof.absarc(1.45,.46,.51,0,Math.PI,false); prof.lineTo(-.94,.46); prof.absarc(-1.45,.46,.51,0,Math.PI,false); prof.lineTo(-2.25,.46);
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(prof, {depth:1.74, bevelEnabled:true, bevelThickness:.14, bevelSize:.11, bevelSegments:6, curveSegments:16}), paint); body.position.z = -.87; body.castShadow = true; g.add(body);
  // glasshouse
  const cab = new THREE.Shape(); cab.moveTo(-1.3,1.0); cab.quadraticCurveTo(-.95,1.03,-.5,1.36); cab.lineTo(.48,1.38); cab.quadraticCurveTo(.95,1.25,1.33,.98); cab.closePath();
  const cabin = new THREE.Mesh(new THREE.ExtrudeGeometry(cab, {depth:1.6, bevelEnabled:true, bevelThickness:.05, bevelSize:.04, bevelSegments:3, curveSegments:16}), glass); cabin.position.set(0,.03,-.8); g.add(cabin);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(.92,.035,1.46), paint); roof.position.set(0,1.435,0); g.add(roof);
  // sills, mirrors, splitter, diffuser
  [[.9,1.02],[.9,-1.02]].forEach(([x,z]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(.2,.09,.14), paint); m.position.set(x,1.08,z); g.add(m); });
  const splitter = new THREE.Mesh(new THREE.BoxGeometry(.18,.06,1.82), trim); splitter.position.set(2.3,.42,0); g.add(splitter);
  const diffuser = new THREE.Mesh(new THREE.BoxGeometry(.2,.1,1.7), trim); diffuser.position.set(-2.26,.44,0); g.add(diffuser);
  const grille = new THREE.Mesh(new THREE.BoxGeometry(.06,.24,.78), trim); grille.position.set(2.34,.66,0); g.add(grille);
  // wheels: tyre + rim + hub, slightly outboard of the body
  const tyre = new THREE.MeshStandardMaterial({color:'#070707', roughness:.92}); const rimM = new THREE.MeshStandardMaterial({color:'#D6DAE2', metalness:.95, roughness:.22}); const hub = new THREE.MeshStandardMaterial({color:'#2A2D33', metalness:.8, roughness:.4});
  [[1.45,.97],[1.45,-.97],[-1.45,.97],[-1.45,-.97]].forEach(([x,z]) => { const t = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,36), tyre); t.rotation.x = Math.PI/2; t.position.set(x,.42,z); t.castShadow = true; g.add(t); const r = new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.32,24), rimM); r.rotation.x = Math.PI/2; r.position.set(x,.42,z); g.add(r); for(let i=0;i<5;i++){ const sp = new THREE.Mesh(new THREE.BoxGeometry(.07,.48,.05), hub); sp.position.set(x,.42,z + (z>0?.17:-.17)); sp.rotation.z = i*Math.PI*2/5; g.add(sp); } const h = new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.36,12), hub); h.rotation.x = Math.PI/2; h.position.set(x,.42,z); g.add(h); });
  // lights
  const head = new THREE.MeshStandardMaterial({color:'#EAF2FF', emissive:'#DCE9FF', emissiveIntensity:1.1}); const tail = new THREE.MeshStandardMaterial({color:'#3A0606', emissive:'#FF1E12', emissiveIntensity:2.4});
  [.6,-.6].forEach(z => { const h = new THREE.Mesh(new THREE.BoxGeometry(.05,.1,.5), head); h.position.set(2.33,.82,z); g.add(h); const t = new THREE.Mesh(new THREE.BoxGeometry(.05,.08,.62), tail); t.position.set(-2.31,.86,z); g.add(t); });
  g.scale.setScalar(s); return g;
}
let trip, map, carL, curve, tube, halo, car, contact, pts = [], labels = [], total = 0, stopsU = [], carIsReal = false, rig = null;
/* armazenamento local do telemóvel (IndexedDB): o .glb do carro nunca sai do aparelho */
function idb(mode, fn){ return new Promise((res, rej) => { const r = indexedDB.open('lr-rota', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onerror = () => rej(r.error); r.onsuccess = () => { const tx = r.result.transaction('files', mode); const q = fn(tx.objectStore('files')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }; }); }
const idbGet = k => idb('readonly', st => st.get(k)), idbSet = (k, v) => idb('readwrite', st => st.put(v, k)), idbDel = k => idb('readwrite', st => st.delete(k));
const WHEELS = ['roda_FE', 'roda_FD', 'roda_TE', 'roda_TD'];
async function loadCar(L){
  try{
    const url = new URLSearchParams(location.search).get('car');
    const buf = url ? null : await idbGet('car').catch(() => null);
    const loader = new GLTFLoader();
    const g = buf ? await loader.parseAsync(buf, '') : await loader.loadAsync(url || 'models/car.glb');
    const m = g.scene; m.traverse(o => { if(o.isMesh){ o.castShadow = true; o.frustumCulled = false; if(o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = 1.1; } });
    const box = new THREE.Box3().setFromObject(m); const size = box.getSize(new THREE.Vector3()); const len = Math.max(size.x, size.z); const k = L/len;
    m.scale.setScalar(k); box.setFromObject(m); m.position.y -= box.min.y; carIsReal = true;
    // rig (convenção do Studio): pivots esterçam em Y, rodas giram em Z (eixo lateral no glTF)
    const piv = {}, wh = {}; WHEELS.forEach(n => { piv[n] = m.getObjectByName(n + '_pivot'); wh[n] = m.getObjectByName(n); });
    if(piv.roda_FE && wh.roda_FE){ m.updateMatrixWorld(true); const a = new THREE.Vector3(), b = new THREE.Vector3(); piv.roda_FE.getWorldPosition(a); piv.roda_TE.getWorldPosition(b);
      rig = {piv, wh, r: Math.max(1e-3, a.y - box.min.y + m.position.y), wb: a.distanceTo(b), spin: 0}; }
    const w = new THREE.Group(); w.add(m); return w;
  }catch(e){ console.warn('carro 3D:', e); carIsReal = false; return buildCar(L); }
}
function animateRig(dist, steer){
  if(!rig) return;
  rig.spin = -dist/rig.r;
  WHEELS.forEach(n => { if(rig.wh[n]) rig.wh[n].rotation.z = rig.spin; if(rig.piv[n]) rig.piv[n].rotation.y = n.startsWith('roda_F') ? steer : 0; });
}
$('#carbtn').addEventListener('click', () => $('#carfile').click());
$('#carfile').addEventListener('change', async e => { const f = e.target.files[0]; if(!f) return; status('A guardar o carro neste telemóvel…'); try{ await idbSet('car', await f.arrayBuffer()); status('Carro guardado. A recarregar…'); setTimeout(() => location.reload(), 400); }catch(err){ status('Não foi possível guardar: ' + err.message); } });
if(TURN) document.querySelector('#turnbtn').textContent = '🗺️ Mapa';
$('#turnbtn').addEventListener('click', () => { const u = new URL(location.href); if(u.searchParams.get('turn')) u.searchParams.delete('turn'); else u.searchParams.set('turn', '1'); location.href = u.toString(); });
async function setupTurn(){
  await Promise.all(['700 56px Caveat','800 20px Inter'].map(f => document.fonts.load(f).catch(()=>{})));
  scene.fog = new THREE.Fog('#05090F', 260, 760); scene.background = new THREE.Color('#05090F'); scene.environmentIntensity = 0.55; carL = 100;
  const floor = new THREE.Mesh(new THREE.CircleGeometry(900, 96), new THREE.MeshStandardMaterial({color:'#07090C', roughness:.55, metalness:0, envMapIntensity:.12})); floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
  const key = new THREE.SpotLight('#FFF4E6', 1.2e5, 0, Math.PI/7, .8, 2); key.position.set(20, 420, 40); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key); scene.add(key.target);
  const tealL = new THREE.SpotLight('#3FA0FF', 5e4, 0, Math.PI/10, .7, 2); tealL.position.set(-300, 260, -340); tealL.target.position.set(0, 50, 0); scene.add(tealL); scene.add(tealL.target);
  const orange = new THREE.SpotLight('#FF8A3D', 2.5e4, 0, Math.PI/10, .7, 2); orange.position.set(360, 70, 300); orange.target.position.set(0, 30, 0); scene.add(orange); scene.add(orange.target);
  sun.intensity = 0.25; rim.intensity = 0.6;
  car = await loadCar(carL); scene.add(car); car.visible = true;
  { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const g = x.createRadialGradient(128,128,8,128,128,124); g.addColorStop(0,'rgba(0,0,0,.85)'); g.addColorStop(.55,'rgba(0,0,0,.45)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,256,256);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(carL*1.25, carL*0.55), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false})); sh.rotation.x = -Math.PI/2; sh.position.y = 0.3; car.add(sh); }
  trip = {origin:{name:'LR Rota'}, dest:{name:'360°'}, distance:0, duration:0};
  setSize(W, H); status(carIsReal ? (rig ? 'Pronto — o seu carro (rodas e direção animadas).' : 'Pronto — o seu carro.') : 'Carro provisório: toque em 🚗 Carro 3D para escolher o seu .glb.'); drawTurn(0.08); overlayTurn();
}
function drawTurn(p){
  car.rotation.set(0, -0.6 + p*Math.PI*2, 0);
  animateRig(p*carL*3, 0.4*Math.sin(p*Math.PI*4));
  const ang = 0.55, dist = carL*1.75; camera.position.set(Math.cos(ang)*dist, carL*0.32, Math.sin(ang)*dist); camera.lookAt(0, carL*0.14, 0);
  bokeh.uniforms.focus.value = camera.position.distanceTo(new THREE.Vector3(0, carL*0.12, 0)); bokeh.uniforms.aperture.value = 0.00002;

}
function overlayTurn(){ octx.drawImage(gl, 0, 0, W, H); const k = W/1280; octx.fillStyle = '#0A5BD6'; rr(octx, 32*k, 32*k, 300*k, 54*k, 27*k); octx.fill(); octx.fillStyle = '#fff'; octx.font = `800 ${20*k}px Inter`; octx.textAlign = 'left'; octx.fillText('LEANDRO NA ROTA', 58*k, 67*k); }
function buildMapOverride(o){
  const c = document.createElement('canvas'); c.width = c.height = TEX; const ctx = c.getContext('2d'); ctx.drawImage(o.img, 0, 0, TEX, TEX);
  const noise = document.createElement('canvas'); noise.width = noise.height = 256; const nd = noise.getContext('2d'); const id = nd.createImageData(256,256); for(let i=0;i<id.data.length;i+=4){ const v = 110 + Math.random()*40; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; } nd.putImageData(id,0,0);
  return { canvas: c, noise, toWorld: p => new THREE.Vector3(p[0]/o.mapM*TEX, 0, -p[1]/o.mapM*TEX), z: 0, ox: 0, oy: 0, override: true };
}
async function setup(){
  await Promise.all(['700 56px Caveat','700 118px Caveat','800 20px Inter','700 22px Inter'].map(f => document.fonts.load(f).catch(()=>{})));
  const OV = window.__mapOverride;
  if(OV){ trip = OV.trip; const img = await loadImg(OV.src); map = buildMapOverride({img, mapM: OV.mapM}); }
  else { trip = loadTrip() || await demoTrip(); map = await buildMap(trip.track && trip.track.length > 20 ? trip.track.map(p => [p.lat,p.lon]) : trip.route); }
  const tex = new THREE.CanvasTexture(map.canvas); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const bump = new THREE.CanvasTexture(map.noise); bump.wrapS = bump.wrapT = THREE.RepeatWrapping; bump.repeat.set(16,16);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(TEX, TEX), new THREE.MeshStandardMaterial({map: tex, roughness: .95, metalness: 0, bumpMap: bump, bumpScale: .5, envMapIntensity: .25}));
  plane.rotation.x = -Math.PI/2; plane.receiveShadow = true; scene.add(plane);
  const base = new THREE.Mesh(new THREE.BoxGeometry(TEX*1.02, 22, TEX*1.02), new THREE.MeshStandardMaterial({color:'#C9B48E', roughness:.9})); base.position.y = -11; scene.add(base);
  const src = trip.track && trip.track.length > 20 ? trip.track.map(p => [p.lat,p.lon]) : trip.route;
  const raw = src.map(map.toWorld); pts = raw.filter((p,i) => i === 0 || p.distanceTo(raw[i-1]) > 1.5); pts.forEach(p => p.y = 1.2);
  curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', .2); total = curve.getLength();
  if(!map.override) await buildDetail(pts, map, bump);
  const span = Math.max(...pts.map(p=>Math.abs(p.x)), ...pts.map(p=>Math.abs(p.z)))*2; carL = Math.max(60, Math.min(120, span*0.11));
  const segs = Math.min(3000, Math.max(400, Math.floor(total/4)));
  tube = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, carL*0.03, 12, false), new THREE.MeshStandardMaterial({color:'#FF7A2A', emissive:'#FF6A2A', emissiveIntensity:2.2, roughness:.35, metalness:.1})); tube.position.y = .6; scene.add(tube);
  halo = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, carL*0.075, 10, false), new THREE.MeshBasicMaterial({color:'#FF7A2A', transparent:true, opacity:.32, depthWrite:false})); halo.position.y = .5; scene.add(halo);
  tube.geometry.setDrawRange(0,0); halo.geometry.setDrawRange(0,0);
  car = await loadCar(carL); car.visible = false; scene.add(car);
  const sc = document.createElement('canvas'); sc.width = sc.height = 256; const sx = sc.getContext('2d'); const sg = sx.createRadialGradient(128,128,10,128,128,120); sg.addColorStop(0,'rgba(0,0,0,.55)'); sg.addColorStop(.5,'rgba(0,0,0,.25)'); sg.addColorStop(1,'rgba(0,0,0,0)'); sx.fillStyle = sg; sx.fillRect(0,0,256,256);
  contact = new THREE.Mesh(new THREE.PlaneGeometry(carL*1.5, carL*0.8), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false})); contact.rotation.x = -Math.PI/2; contact.position.y = 1.0; contact.visible = false; scene.add(contact);
  const mk = (name, p, big) => { const c = document.createElement('canvas'); c.width = 1024; c.height = 256; const x = c.getContext('2d'); x.font = `700 ${big?118:96}px Caveat`; x.textAlign = 'center'; x.shadowColor = 'rgba(0,0,0,.7)'; x.shadowBlur = 18; x.shadowOffsetY = 4; x.fillStyle = '#FFFFFF'; x.fillText(name, 512, 165); const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), transparent: true, depthTest: false})); sp.scale.set(carL*1.5, carL*0.375, 1); sp.position.copy(p).add(new THREE.Vector3(carL*0.8, carL*0.5, carL*0.25)); sp.material.opacity = 0; scene.add(sp); const dot = new THREE.Mesh(new THREE.CylinderGeometry(carL*0.05, carL*0.05, carL*0.012, 24), new THREE.MeshStandardMaterial({color:'#FFF4E6', roughness:.6})); dot.position.copy(p); dot.visible = false; scene.add(dot); return {sp, dot}; };
  labels = [{...mk(trip.origin.name, pts[0], false), u: 0}, ...(trip.stops||[]).map(s => { const p = map.toWorld([s.lat, s.lon]); let bu = 0, bd = 1e18; for(let i=0;i<pts.length;i+=4){ const d = pts[i].distanceToSquared(p); if(d<bd){ bd=d; bu=i/(pts.length-1); } } return {...mk(s.name, curve.getPointAt(Math.min(1,bu)), false), u: bu}; }), {...mk(trip.dest.name, pts.at(-1), true), u: 1}];
  stopsU = labels.map(l => l.u);
  setSize(W, H); status(carIsReal ? 'Pronto — o seu carro 3D.' : 'Pronto — carro provisório. Toque em 🚗 Carro 3D para usar o seu .glb (fica só neste telemóvel).'); drawFrame(0.36); overlay(0.36, false);
}

/* ---------- animation script (5 cenas) ---------- */
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const smooth = (a,b,t) => Math.min(1, Math.max(0, (t-a)/(b-a)));
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmp = new THREE.Vector3(), lookAt = new THREE.Vector3();
let first = true;
function drawFrame(p){
  const span = TEX*0.55;
  const draw = ease(smooth(.10,.42,p));       // cena 2: a linha desenha-se
  const carU = ease(smooth(.22,.86,p));       // cena 3-4: o carro percorre
  const reveal = ease(smooth(.84,1,p));       // cena 5: afastar
  const idxT = tube.geometry.index.count, idxH = halo.geometry.index.count;
  tube.geometry.setDrawRange(0, Math.floor(idxT*carU)); halo.geometry.setDrawRange(0, Math.floor(idxH*draw));
  const cu = Math.max(0.0005, Math.min(.9995, carU)); const cp = curve.getPointAt(cu), ct = curve.getTangentAt(cu);
  car.visible = p > .2; car.position.copy(cp); car.position.y = 0.6; car.rotation.y = Math.atan2(-ct.z, ct.x); contact.visible = car.visible; contact.position.set(cp.x, 1.0, cp.z); contact.rotation.z = car.rotation.y;
  const turnRate = -ct.clone().cross(curve.getTangentAt(Math.min(.9995,cu+.004))).y;
  car.rotation.z = THREE.MathUtils.clamp(turnRate*18, -.08, .08);
  animateRig(carU*total*0.04, THREE.MathUtils.clamp(turnRate*120, -.45, .45));   // rotação visual reduzida (rotas de km comprimidas em segundos)
  labels.forEach(l => { const on = l.u <= carU + .01 || (l.u === 0 && p > .05) || (l.u === 1 && p > .9); l.sp.material.opacity += ((on?1:0) - l.sp.material.opacity)*.12; l.dot.visible = on; });
  sun.position.copy(cp).add(new THREE.Vector3(carL*4, carL*6, carL*2.5)); sun.target.position.copy(cp); const sc = sun.shadow.camera; const r = carL*3; sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 10; sc.far = carL*20; sc.updateProjectionMatrix();
  // camera targets per scene
  const head = cp.clone().add(ct.clone().multiplyScalar(carL*0.9)); const back = ct.clone().multiplyScalar(-1);
  const origin = pts[0];
  const far = tmp.set(origin.x + span*.9, span*1.25, origin.z + span*1.1); const near = new THREE.Vector3(origin.x + carL*2.4, carL*1.6, origin.z + carL*3.0);
  const right = new THREE.Vector3().crossVectors(ct, new THREE.Vector3(0,1,0)).normalize();
  const chase = cp.clone().add(back.multiplyScalar(carL*3.3)).add(right.multiplyScalar(carL*1.45)).add(new THREE.Vector3(0, carL*0.95, 0));
  const over = new THREE.Vector3(span*.1, span*1.35, span*.85);
  if(p < .22){ const t = ease(smooth(0,.22,p)); camPos.copy(far).lerp(near, t); camLook.copy(origin); }
  else if(p < .84){ camPos.copy(chase); camLook.copy(head); }
  else { camPos.copy(chase).lerp(over, reveal); camLook.copy(head).lerp(new THREE.Vector3(0,0,0), reveal); }
  if(first){ camera.position.copy(camPos); lookAt.copy(camLook); first = false; }
  camera.position.lerp(camPos, p < .22 ? 1 : .12); lookAt.lerp(camLook, .14); camera.lookAt(lookAt);
  bokeh.uniforms.focus.value = camera.position.distanceTo(p < .22 ? origin : (p < .84 ? cp : new THREE.Vector3(0,0,0))); bokeh.uniforms.aperture.value = p < .22 || p >= .84 ? 0.000012 : 0.00003;
  composer.render();
}
function overlay(p, recording){
  octx.drawImage(gl, 0, 0, W, H); const k = W/1280; const vg = octx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.0); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(2,8,16,.55)'); octx.fillStyle = vg; octx.fillRect(0,0,W,H);
  octx.fillStyle = '#0A5BD6'; rr(octx, 32*k, 32*k, 300*k, 54*k, 27*k); octx.fill(); octx.fillStyle = '#fff'; octx.font = `800 ${20*k}px Inter`; octx.textAlign = 'left'; octx.fillText('LEANDRO NA ROTA', 58*k, 67*k);
  octx.font = `700 ${56*k}px Caveat`; octx.shadowColor = 'rgba(0,0,0,.6)'; octx.shadowBlur = 14*k; octx.fillText(`${trip.origin.name} → ${trip.dest.name}`, 36*k, 140*k); octx.shadowBlur = 0;
  const dd = trip.trackDistance || trip.distance; const q = ease(smooth(.22,.86,p)); const txt = `${km(dd*q)} · ${eur(dd*q/1000*settings.cons/100*settings.price)} ${settings.fuel.toLowerCase()} · ${mins(trip.duration)}`; octx.font = `700 ${22*k}px Inter`; const w = octx.measureText(txt).width + 40*k; octx.fillStyle = 'rgba(10,16,28,.78)'; rr(octx, 32*k, H-86*k, w, 54*k, 14*k); octx.fill(); octx.strokeStyle = '#FF6A2A'; octx.lineWidth = 2*k; octx.globalAlpha = .8; octx.stroke(); octx.globalAlpha = 1; octx.fillStyle = '#fff'; octx.fillText(txt, 52*k, H-50*k);
  if(recording){ octx.fillStyle = '#FF3B30'; octx.beginPath(); octx.arc(W-40*k, 52*k, 9*k, 0, 7); octx.fill(); }
}
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

let raf = null;
function play(onEnd, recording){ const D = +$('#dur').value*1000; const t0 = performance.now(); first = true; cancelAnimationFrame(raf); (function step(){ const p = Math.min(1, (performance.now()-t0)/D); if(TURN){ drawTurn(p); overlayTurn(); } else { drawFrame(p); overlay(p, recording); } status(recording ? `A gravar… ${Math.round(p*100)}%` : `${Math.round(p*100)}%`); if(p < 1) raf = requestAnimationFrame(step); else { status('Fim.'); if(onEnd) setTimeout(onEnd, 500); } })(); }
$('#play').addEventListener('click', () => play());
$('#res').addEventListener('change', e => { const w = +e.target.value; setSize(w, w*9/16); if(TURN){ drawTurn(0.08); overlayTurn(); } else { drawFrame(0.36); overlay(0.36,false); } });
$('#rec').addEventListener('click', () => {
  if(!('MediaRecorder' in window)){ status('Este browser não grava vídeo; grave o ecrã durante a reprodução.'); return; }
  const mime = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(out.captureStream(30), {mimeType: mime, videoBitsPerSecond: W >= 3840 ? 48e6 : W >= 1920 ? 20e6 : 10e6}); const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => { const blob = new Blob(chunks, {type: mime}); const file = new File([blob], `lr-rota-cinema-${trip.dest.name}.${mime.includes('mp4')?'mp4':'webm'}`, {type: mime}); if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file], title:'LR Rota'}).catch(()=>{}); else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); } $('#rec').disabled = false; status('Vídeo pronto.'); };

});
window.__cinema = { drawFrame, overlay, drawTurn, overlayTurn, play, THREE, get trip(){ return trip; }, get car(){ return car; }, get map(){ return map; }, get carL(){ return carL; }, get rig(){ return rig; }, get ready(){ return !!composer; } };
(TURN ? setupTurn() : setup()).catch(e => { console.error(e); status('Erro: ' + e.message); });
</script>
