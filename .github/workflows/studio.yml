name: Rota Cinema Studio — render (Blender/Cycles)
on:
  workflow_dispatch:
    inputs:
      origin: { description: "Origem (texto, ex. Viana do Castelo) — vazio = trip.json", default: "" }
      dest: { description: "Destino", default: "" }
      stops: { description: "Paragens separadas por ; (opcional)", default: "" }
      mode: { description: "stills | clip", default: "stills" }
      w: { description: "largura", default: "1280" }
      h: { description: "altura", default: "720" }
      samples: { description: "amostras Cycles", default: "64" }
      dur: { description: "duração do clip (s)", default: "5" }
      fps: { description: "fps", default: "24" }
  push:
    paths: ["studio/**", ".github/workflows/studio.yml"]
permissions:
  contents: write
concurrency: { group: studio, cancel-in-progress: false }
jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[render')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ github.event.inputs.mode || 'stills' }}
      W: ${{ github.event.inputs.w || '1280' }}
      H: ${{ github.event.inputs.h || '720' }}
      SAMPLES: ${{ github.event.inputs.samples || '64' }}
      DUR: ${{ github.event.inputs.dur || '5' }}
      FPS: ${{ github.event.inputs.fps || '24' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y libegl1 libgl1 libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 libxfixes3 libgomp1 ffmpeg
      - run: pip install bpy pillow playwright && python -m playwright install --with-deps chromium
      - name: Viagem (inputs → trip.json)
        if: github.event.inputs.origin != '' && github.event.inputs.dest != ''
        run: |
          python - <<'PY'
          import json, os
          o, d, st = os.environ['O'], os.environ['D'], os.environ['ST']
          json.dump({"origin": o, "dest": d, "stops": [s.strip() for s in st.split(';') if s.strip()]}, open('studio/trip.json', 'w'), ensure_ascii=False, indent=2)
          PY
        env: { O: "${{ github.event.inputs.origin }}", D: "${{ github.event.inputs.dest }}", ST: "${{ github.event.inputs.stops }}" }
      - name: Rota real (OSRM) + mapa (OpenFreeMap vetorial → MapLibre headless)
        run: python studio/build_assets.py
      - name: Render (Cycles, CPU)
        run: |
          MSG="${{ github.event.head_commit.message }}"
          case "$MSG" in *"[render clip"*) MODE=clip; W=${W_CLIP:-960}; H=${H_CLIP:-540}; SAMPLES=${S_CLIP:-32};; esac
          case "$MODE" in clip*) MODE=clip;; *) MODE=stills;; esac
          echo "MODE=$MODE W=$W H=$H SAMPLES=$SAMPLES DUR=$DUR FPS=$FPS"; export MODE W H SAMPLES
          echo "MODE=$MODE" >> "$GITHUB_ENV"; echo "W=$W" >> "$GITHUB_ENV"; echo "H=$H" >> "$GITHUB_ENV"; echo "SAMPLES=$SAMPLES" >> "$GITHUB_ENV"
          if [ "$MODE" = "stills" ]; then
            STILL_P="0.30,0.55,0.90" python -c "import runpy; runpy.run_path('studio/render_blender.py')"
            STILL_P="0.10,0.40,0.70" RENDER=0 EXPORT=1 python -c "import runpy; runpy.run_path('studio/turntable.py')"
          else
            FRAMES="" python -c "import runpy; runpy.run_path('studio/render_blender.py')"
          fi
          python studio/overlay_frames.py
          if [ "$MODE" = "clip" ]; then
            ffmpeg -y -framerate "$FPS" -i studio/out/frames/f%04d.ov.png -c:v libx264 -pix_fmt yuv420p -crf 17 -preset slow studio/out/cinema.mp4
          fi
      - name: Publicar resultados no repositório
        if: always()
        run: |
          set -x
          D="studio/renders/$(date -u +%Y%m%d-%H%M)-${MODE:-stills}-${W}x${H}"
          mkdir -p "$D"
          cp studio/out/frames/*.ov.png "$D"/ 2>/dev/null || true
          cp studio/out/frames/still_*.png studio/out/frames/turn_*.png "$D"/ 2>/dev/null || true
          cp studio/out/cinema.mp4 "$D"/ 2>/dev/null || true
          cp studio/out/scene.json "$D"/ 2>/dev/null || true
          python -c "from PIL import Image; Image.MAX_IMAGE_PIXELS=None; Image.open('studio/out/map.png').convert('RGB').resize((1536,1536)).save('$D/map_preview.jpg', quality=82)" || echo "preview falhou"
          echo "modo=${MODE:-stills} w=$W h=$H samples=$SAMPLES dur=$DUR fps=$FPS carro_glb=$(test -f models/car.glb && echo sim || echo nao)" > "$D"/info.txt
          ls -la studio/out/frames/ > "$D"/frames_ls.txt 2>&1 || true
          git status --porcelain > "$D"/git_status.txt 2>&1 || true
          git config user.name "rota-cinema-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f "$D"; git add -f studio/assets 2>/dev/null || true
          git commit -m "Render Studio: $D [skip ci]" || { echo "nada para publicar"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash -q origin main && git push origin HEAD:main && exit 0
            sleep 8
          done
          exit 1
